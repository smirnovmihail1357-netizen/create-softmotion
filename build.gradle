plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.softmotion'
base.archivesName = 'Create-SoftMotion'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.252'

    runs {
        client {
            client()
        }
    }

    mods {
        softmotion {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    maven { url = 'https://maven.createmod.net' } // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } // ponder config api
}

dependencies {
    // Create for dev environment (see https://wiki.createmod.net/developers/depend-on-create/neoforge-1.21.1)
    implementation('com.simibubi.create:create-1.21.1:6.0.10-280:slim') {
        transitive = false
    }
    implementation 'net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1'
    implementation 'com.tterrag.registrate:Registrate:MC1.21-1.3.0+67'
    compileOnly 'dev.engine-room.flywheel:flywheel-neoforge-api-1.21.1:1.0.6'
    runtimeOnly 'dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6'
}

jar {
    from 'LICENSE'
}
