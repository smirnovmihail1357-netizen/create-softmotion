plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

version = '1.0.0'
group = 'com.softmotion'
base.archivesName = 'Create-SoftMotion'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = '21.1.252'

    runs {
        client {
            client()
        }
    }

    mods {
        softmotion {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    // Local mirror of Modrinth-hosted jars (Modrinth maven coordinates), used because
    // maven.createmod.net currently serves an expired TLS certificate (Let's Encrypt YR1).
    // Fetch with: ./fetch-libs.sh
    maven { url = uri(layout.projectDirectory.dir('libs-maven')) }
    maven { url = 'https://maven.createmod.net' } // Create, Ponder, Flywheel
    maven { url = 'https://maven.ithundxr.dev/snapshots' } // Registrate
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/' } // ponder config api
}

dependencies {
    // Create 6.0.10 for mc1.21.1 (Modrinth release; bundles flywheel/ponder/Registrate
    // in META-INF/jarjar, so they load in the dev client without extra dependencies).
    implementation('com.simibubi.create:create-1.21.1:6.0.10') {
        transitive = false
    }
    // RotatingInstance extends flywheel lib classes -> needed on the compile classpath.
    compileOnly('dev.engine-room.flywheel:flywheel-neoforge-1.21.1:1.0.6') {
        transitive = false
    }
}

jar {
    from 'LICENSE'
}
