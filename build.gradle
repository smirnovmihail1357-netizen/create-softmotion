plugins {
    // ForgeGradle 4.1.x (Java 8). FG 4.1 hard-rejects Gradle 7.0+ ("Support for
    // Gradle 7 will be added in ForgeGradle 5"), so this build pins Gradle 6.9.4,
    // the same line the official 1.16.5 MDK used. Resolved from the MinecraftForge
    // maven declared in settings.gradle.
    id 'net.minecraftforge.gradle' version '4.1.16'
}

version = '1.1.1+1.16.5'
group = 'com.softmotion'
archivesBaseName = 'Create-SoftMotion'

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

// ForgeGradle 4.1.16 bug workaround: several mapping writers (MCPRepo.findRenames,
// MinecraftUserRepo.findSrgToMcp) write into cache directories without ever creating
// them, so a first build on a fresh cache dies with NoSuchFileException. Pre-create
// them at configuration time (1.16.5-20210115.111550 is the MCP config version pinned
// by forge 1.16.5-36.2.9's userdev metadata).
new File(gradle.gradleUserHomeDir, "caches/forge_gradle/mcp_repo/de/oceanlabs/mcp/mcp_config/1.16.5").mkdirs()
new File(gradle.gradleUserHomeDir, "caches/forge_gradle/minecraft_user_repo/de/oceanlabs/mcp/mcp_config/1.16.5-20210115.111550").mkdirs()

compileJava {
    options.encoding = 'UTF-8'
}

minecraft {
    // Official (Mojang) mappings layer; Create 0.3.2g classes are unobfuscated,
    // so the mixins use string targets with remap = false.
    mappings channel: 'official', version: '1.16.5'

    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.console.level', 'debug'

            // Dev runs use an exploded directory, which has no jar manifest, so the
            // MixinConfigs attribute never reaches FML. Register the config directly
            // instead (production jars pick it up from the manifest attribute).
            arg '-mixin.config=softmotion.mixins.json'

            mods {
                softmotion {
                    source sourceSets.main
                }
            }
        }
    }
}

repositories {
    flatDir { dirs 'libs' }

    // ForgeGradle's manual downloader (MavenArtifactDownloader) resolves MCP artifacts
    // (e.g. de.oceanlabs.mcp:mcp_config:1.16.5@zip) against the project repositories.
    maven {
        name = 'MinecraftForge'
        url = 'https://files.minecraftforge.net/maven'
    }
}

dependencies {
    // 36.2.42 (final 1.16.5 build) instead of 36.2.9: it ships modlauncher 8.1.3,
    // whose SecureJarHandler constructs sun.security.util.ManifestEntryVerifier
    // reflectively. 8.0.9 hardcodes the old <init>(Manifest) constructor that modern
    // JDK 8 builds (8u301+) removed, which crashes the dev client at startup.
    minecraft 'net.minecraftforge:forge:1.16.5-36.2.42'

    // Create 0.3.2g for 1.16.5 (Forge-only, unmaintained; CurseForge release) plus
    // its mandatory flywheel dependency (CurseForge file 3535459, released the same
    // day as Create 0.3.2g; satisfies Create's required range [1.16-0.2.3, 1.16-0.3)).
    // Both are production jars with SRG-named Minecraft references, so they must go
    // through fg.deobf() to be remapped into the dev (official/mojmap) namespace.
    // Fetch with: ./fetch-libs.sh
    implementation fg.deobf('local:create-mc1.16.5_v0.3.2g:0.3.2g')
    implementation fg.deobf('local:flywheel-1.16-0.2.5:0.2.5')
}

jar {
    manifest {
        // 1.16.5 declares mixin configs via the jar manifest, not mods.toml.
        attributes 'MixinConfigs': 'softmotion.mixins.json'
    }
    from 'LICENSE'
}

jar.finalizedBy('reobfJar')
