# Build memory; the loom + forge userdev pipelines need room.
org.gradle.jvmargs=-Xmx4G

# Run Gradle itself with a Java 17..21 JVM (the wrapper refuses newer launchers).
# The machine-local JDK lives outside the repository, e.g. ~/.jdks/temurin-21.

minecraft_version=1.19.2

# https://files.minecraftforge.net/net/minecraftforge/forge/ (1.19.2 line)
forge_version=43.2.4

# Fabric side
fabric_loader_version=0.15.11
fabric_api_version=0.77.0+1.19.2

# Create 0.5.1.i dependencies (dev only).
# maven.createmod.net hosts nothing for MC 1.18/1.19: the forge Create jar comes
# from the Modrinth maven (loom remaps the SRG production jar to named), and
# flywheel-forge + Registrate (nested in its META-INF/jarjar) plus
# flywheel-fabric (nested in the create-fabric JiJ) are extracted into
# libs-maven/ by fetch-libs.sh.
create_forge_version=1.19.2-0.5.1.i
create_fabric_version=0.5.1-i-build.1630+mc1.19.2
flywheel_forge_version=0.6.11-22
flywheel_fabric_version=0.6.11-9
registrate_forge_version=1.1.5

mod_version=1.1.1+1.19.2
maven_group=com.softmotion
