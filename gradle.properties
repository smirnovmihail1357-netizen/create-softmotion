# Build memory; the loom + forge userdev pipelines need room.
org.gradle.jvmargs=-Xmx4G

# Run Gradle itself with a Java 17..21 JVM (the wrapper refuses newer launchers).
# The machine-local JDK lives outside the repository, e.g. ~/.jdks/temurin-21.

minecraft_version=1.20.1

# https://files.minecraftforge.net/net/minecraftforge/forge/ (1.20.1 line)
# NeoForge 20.1 is binary-compatible with this Forge line and reports loader
# version 47.x, so the same jar is published for both loaders (Create does the same).
forge_version=47.1.43

# Fabric side
fabric_loader_version=0.17.2
fabric_api_version=0.92.12+1.20.1

# Create dependencies (dev only).
# Forge artifacts come from maven.createmod.net; create-fabric is not hosted
# on a public maven, so it is resolved through the Modrinth maven.
create_forge_version=6.0.8-291
create_fabric_version=6.0.8.1+build.1744-mc1.20.1
ponder_version=1.0.91
registrate_version=MC1.20-1.3.3
flywheel_version=1.0.5
flywheel_fabric_version=1.0.5-264
mixin_extras_version=0.4.1

mod_version=1.1.1+1.20.1
maven_group=com.softmotion
