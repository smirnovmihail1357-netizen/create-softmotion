modLoader="javafml"
loaderVersion="[36,)"
license="MIT"

[[mods]]
modId="softmotion"
version="1.1.1+1.16.5"
displayName="Create: SoftMotion"
authors="WarDreg"
description="""Accessibility addon for Create designed for players with visual hypersensitivity.

SoftMotion reduces the visual rotation speed of Create machinery and contraptions without affecting gameplay, stress calculations, RPM, or kinetic networks.
"""

[[dependencies.softmotion]]
modId="forge"
mandatory=true
versionRange="[36,)"
ordering="NONE"
side="BOTH"

[[dependencies.softmotion]]
modId="minecraft"
mandatory=true
versionRange="[1.16.5,1.16.6)"
ordering="NONE"
side="BOTH"

# Create for 1.16.5 = 0.3.2g, whose mods.toml declares version "v0.3.2g". The leading
# "v" sorts BELOW "0.3.2" in Forge's version comparator (verified with the same
# Maven ComparableVersion Forge 36 uses), so a "[0.3.2,)" range would never match
# and the dependency would fail. "[0,)" matches "v0.3.2g" (verified empirically).
[[dependencies.softmotion]]
modId="create"
mandatory=true
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
