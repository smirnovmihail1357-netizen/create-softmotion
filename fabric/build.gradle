plugins {
    id 'com.github.johnrengelman.shadow'
}

base { archivesName = 'create-softmotion-fabric' }

architectury {
    platformSetupLoomIde()
    fabric()
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Local copy of create-fabric with its JiJ stripped: loom's remap of the raw
    // maven artifact no-ops on nested jars, leaving intermediary names in the dev
    // runtime. The extracted JiJ jars below are added explicitly instead.
    modImplementation files(rootProject.file('libs-maven/create-fabric-dev.jar'))

    // create-fabric bundles the rest of its dependencies (flywheel, ponder, registrate,
    // porting_lib, forgeconfigapiport, milk, reach) inside META-INF/jars. Fabric Loader
    // does not pick up nested jars from a dev classpath, so ./fetch-libs.sh (run once)
    // extracts them into libs-maven/fabric-jij and we add them explicitly.
    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionFabric')) { transitive = false }

    rootProject.file('libs-maven/fabric-jij').listFiles()?.findAll { it.name.endsWith('.jar') }?.each { File jar ->
        boolean library = jar.name.startsWith('core-') || jar.name.startsWith('jsr305') || jar.name.startsWith('toml-')
        if (library) {
            runtimeOnly files(jar)
        } else {
            modRuntimeOnly files(jar)
        }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.jar {
    archiveClassifier = 'dev'
}

shadowJar {
    archiveClassifier = 'dev-shadow'
    configurations = [project.configurations.shadowCommon]
    destinationDirectory = layout.buildDirectory.dir('devlibs')
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
    from rootProject.file('LICENSE')
}
