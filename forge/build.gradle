plugins {
    id 'com.github.johnrengelman.shadow'
}

base { archivesName = 'create-softmotion-forge' }

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig 'softmotion.mixins.json'
    }
    runs.configureEach {
        // Create and flywheel 0.5.1 ship their mixin configs through jar manifests
        // for production; the architectury-loom forge dev runtime needs them spelled
        // out explicitly.
        programArg '-mixin.config=create.mixins.json'
        programArg '-mixin.config=flywheel.mixins.json'
    }
}

tasks.withType(JavaExec).configureEach {
    // The game process must run on Java 17: the mixin/ASM shipped with Forge 43
    // cannot read newer JDK class files (ClassMetadataNotFound on java.lang.System
    // when the game JVM is 21). loom 1.11 itself requires Gradle on 21, so the
    // daemon JVM is deliberately left alone and only the game is pinned to 17.
    javaLauncher.set(javaToolchains.launcherFor {
        it.languageVersion = JavaLanguageVersion.of(17)
    })
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:${rootProject.minecraft_version}-${rootProject.forge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionForge')) { transitive = false }

    // Create 0.5.1.i production jar (SRG) from the Modrinth maven; loom remaps
    // it to named. Ponder is compiled into the jar; flywheel and Registrate are
    // only nested (META-INF/jarjar), which the loom forge dev runtime does not
    // unpack, so they are provided explicitly from libs-maven/ (fetch-libs.sh).
    modImplementation "maven.modrinth:create:${rootProject.create_forge_version}"
    modImplementation "libs.createmod:flywheel-forge-${rootProject.minecraft_version}:${rootProject.flywheel_forge_version}"
    modRuntimeOnly "libs.createmod:Registrate-MC1.19:${rootProject.registrate_forge_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand 'version': project.version
    }
}

tasks.jar {
    archiveClassifier = 'dev'
}

shadowJar {
    archiveClassifier = 'dev-shadow'
    configurations = [project.configurations.shadowCommon]
    destinationDirectory = layout.buildDirectory.dir('devlibs')
    // Forge 1.20.1 does not read mixin configs from mods.toml; this manifest
    // attribute is how Create itself registers create.mixins.json in production.
    manifest {
        attributes 'MixinConfigs': 'softmotion.mixins.json'
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
    from rootProject.file('LICENSE')
}
