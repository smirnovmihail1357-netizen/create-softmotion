modLoader="javafml"
loaderVersion="[40,)"
license="MIT"

[[mods]]
modId="softmotion"
version="${version}"
displayName="Create: SoftMotion"
authors="WarDreg"
description="""Accessibility addon for Create designed for players with visual hypersensitivity.

SoftMotion reduces the visual rotation speed of Create machinery and contraptions without affecting gameplay, stress calculations, RPM, or kinetic networks.
"""

[[dependencies.softmotion]]
modId="forge"
mandatory=true
versionRange="[40.2.4,)"
ordering="NONE"
side="BOTH"

[[dependencies.softmotion]]
modId="minecraft"
mandatory=true
versionRange="[1.18.2,1.18.3)"
ordering="NONE"
side="BOTH"

[[dependencies.softmotion]]
modId="create"
mandatory=true
# "[0.5.0,)" and not "[0.5.1,)": the maven comparator treats the "i" in "0.5.1.i"
# as a qualifier of 0.5.1, i.e. lower than a hypothetical release "0.5.1".
versionRange="[0.5.0,)"
ordering="AFTER"
side="CLIENT"
